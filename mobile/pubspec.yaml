name: videoget_mobile
description: VideoGET Android video aggregation and playback client.
publish_to: 'none'
version: 0.0.3+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  battery_plus: ^7.1.1
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  file_picker: ^11.0.3
  flutter_svg: ^2.3.0
  flutter_js: ^0.8.7
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  image_path: assets/videoget-icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/videoget-icon.svg
    - assets/videoget-icon.png
    - assets/shorts/
